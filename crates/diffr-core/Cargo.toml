[package]
name = "diffr-core"
description = "The diffr engine: parsing, structural diffing, configuration and the plugin cursor."
repository = "https://github.com/devdotfast/diffr"
homepage = "https://github.com/devdotfast/diffr"
license = "MIT"
version = "0.1.10"
authors = ["dev.fast"]
keywords = ["diff", "syntax"]
categories = ["development-tools", "parser-implementations"]
edition = "2021"
rust-version = "1.99.0"

include = [
        "/build.rs",
        "/src/",
]

[dependencies]
regex = "1.10.4"
typed-arena = "2.0.2"
rustc-hash = "2.0.0"
strsim = "0.11.0"
lazy_static = "1.4.0"
log = "0.4.14"

radix-heap = "0.4.2"
imara-diff = { version = "0.2.0", default-features = false }

bumpalo = "3.18.0"
glob = "0.3.2"
strum = { version = "0.28", features = ["derive"] }
hashbrown = "0.17.0"
humansize = "2.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
line-numbers = "0.3.0"
smallvec = "1.13.2"
streaming-iterator = "0.1.9"

# tree-sitter itself.
#
# Note that tree-sitter 0.26.11 is currently not compatible with
# tree-sitter-solidity: https://github.com/JoranHonig/tree-sitter-solidity/pull/80
tree-sitter = "0.26.10"

# tree-sitter parsers that are available on crates.io.
tree-sitter-ada = "0.1.0"
tree-sitter-asm = "0.24.0"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-clojure-orchard = "0.2.5"
tree-sitter-cmake = "0.7.1"
tree-sitter-containerfile = "0.8.0"
tree-sitter-commonlisp = "0.4.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart-orchard = "0.5.0"
tree-sitter-devicetree = "0.14.1"
tree-sitter-elisp = "1.7.0"
tree-sitter-elixir = "0.3.4"
tree-sitter-elm = "5.8.0"
tree-sitter-erlang = "0.20.0"
tree-sitter-fish = "3.6.0"
tree-sitter-fortran = { version = "0.6.0", optional = true }
tree-sitter-fsharp = { version = "0.3.0", optional = true }
tree-sitter-gleam = "1.0.0"
tree-sitter-go = "0.25.0"
tree-sitter-haskell = { version = "0.23.1", optional = true }
tree-sitter-hcl = "1.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-java-orchard = "0.5.9"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-julia = { version = "0.23.1", optional = true }
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1.1"
tree-sitter-newick = "1.1.0"
tree-sitter-nix = "0.3.0"
tree-sitter-objc = "3.0.2"
tree-sitter-ocaml = { version = "0.25.0", optional = true }
tree-sitter-pascal = "0.10.0"
tree-sitter-php = "0.24.0"
tree-sitter-proto = "0.4.0"
tree-sitter-python = "0.25.0"
tree-sitter-qmljs = { version = "0.3.0", optional = true }
tree-sitter-r = "1.2.0"
tree-sitter-racket = "0.24.7"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust-orchard = "0.16.6"
tree-sitter-scala = "0.26.2"
tree-sitter-scheme = "0.24.7"
tree-sitter-sequel = "0.3.11"
tree-sitter-sfapex = { version = "2.4.0", optional = true }
tree-sitter-solidity = "1.2.13"
tree-sitter-swift = "0.7.1"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-verilog = { version = "1.0.3", optional = true }
tree-sitter-vhdl = { version = "1.4.0", optional = true }
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.0"
tree-sitter-zig = "1.1.2"
ts-parser-perl = "1.2.0"
toml = { version = "0.8", default-features = false, features = ["display", "parse"] }
serde_path_to_error = "0.1.20"
schemars = { version = "1.2.2", features = ["preserve_order"] }
dirs = "5"
toml_edit = "0.25.15"
jsonschema = { version = "0.56.0", default-features = false }
# The plugin contract's records, generated from the SDK's WIT without a
# component runtime.

[dev-dependencies]
pretty_assertions = "1.3.0"
tempfile = "3.27.0"

[build-dependencies]
toml = "0.8"
# TODO: enable parallel mode, see discussion in
# https://github.com/rust-lang/cc-rs/pull/849
cc = "1.2.48"
rayon = "1.7.0"

[features]
all-languages = ["lang-fortran", "lang-fsharp", "lang-verilog", "lang-ocaml", "lang-julia", "lang-haskell", "lang-vhdl", "lang-apex", "lang-qml"]
lang-fortran = ["dep:tree-sitter-fortran"]
lang-fsharp = ["dep:tree-sitter-fsharp"]
lang-verilog = ["dep:tree-sitter-verilog"]
lang-ocaml = ["dep:tree-sitter-ocaml"]
lang-julia = ["dep:tree-sitter-julia"]
lang-haskell = ["dep:tree-sitter-haskell"]
lang-vhdl = ["dep:tree-sitter-vhdl"]
lang-apex = ["dep:tree-sitter-sfapex"]
lang-qml = ["dep:tree-sitter-qmljs"]
# Constructors and helpers the diffr package's tests build on.
test-support = []
