[package]
name = "diffr-plugin-summarize"
description = "The summarize plugin: pseudocode summaries for large new function bodies."
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
publish = false

[dependencies]
diffr-plugin-sdk = { path = "../../crates/diffr-plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi = "=0.14.2"

[package.metadata.diffr]
native = true
