[package]
name = "diffr-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "async", "serde-json"] }
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "=2.1.3"
