[package]
name = "diffr-core"
description = "diffr's structural diff engine and diff session: tree-sitter parsing, AST diffing, folds, configuration, the plugin pipeline, file tags and the wire records."
repository = "https://github.com/devdotfast/diffr"
license = "MIT"
version = "0.1.9"
edition = "2021"
rust-version = "1.99.0"
include = [
        "/build.rs",
        "/src/",
        "/vendored_parsers/highlights/*.scm",
        "/vendored_parsers/*-src/**/*.c",
        "/vendored_parsers/*-src/**/*.h",
]

# The doc comments' code blocks are diagrams, not examples.
[lib]
doctest = false

[dependencies]
regex = "1.13.1"
rustc-hash = "2.1.3"
strsim = "0.11.1"
typed-arena = "2.0.2"
radix-heap = "0.4.2"
imara-diff = { version = "0.2.0", default-features = false }
bumpalo = "3.20.3"
hashbrown = "0.17.1"
smallvec = "1.16.2"
line-numbers = "0.4.0"
streaming-iterator = "0.1.9"
strum = { version = "0.28", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4.34"
glob = "0.3.4"
humansize = "2.1.3"
anyhow = "1.0"

# Configuration: the TOML file, its JSON Schema, and each plugin's options
# checked against the schema in its plugin.toml.
toml = { version = "1.1", default-features = false, features = ["display", "parse", "serde", "std"] }
toml_edit = "0.25.15"
serde_path_to_error = "0.1.20"
schemars = { version = "1.2.2", features = ["preserve_order"] }
jsonschema = { version = "0.58.4", default-features = false }
# Linguist's path lists, for file tags.
serde_yaml_ng = "0.10.0"
# The plugin contract, and the bundled plugins: each a crate the native
# registry calls, which also builds as a WASM component.
diffr-plugin-sdk = { path = "../diffr-plugin-sdk", version = "0.1.1" }
diffr-plugin-context = { path = "../../plugins/context", version = "0.1.1" }
diffr-plugin-deleted-bodies = { path = "../../plugins/deleted-bodies", version = "0.1.1" }
diffr-plugin-group = { path = "../../plugins/group", version = "0.1.1" }
diffr-plugin-hide-files = { path = "../../plugins/hide-files", version = "0.1.1" }
diffr-plugin-removed-runs = { path = "../../plugins/removed-runs", version = "0.1.1" }
diffr-plugin-summarize = { path = "../../plugins/summarize", version = "0.1.1" }
diffr-plugin-test-bodies = { path = "../../plugins/test-bodies", version = "0.1.1" }

# tree-sitter itself, and the parsers that are available on crates.io.
tree-sitter = "0.27.0"
tree-sitter-language = "0.1.8"
tree-sitter-ada = "0.1.0"
tree-sitter-asm = "0.24.0"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-clojure-orchard = "0.2.8"
tree-sitter-cmake = "0.7.5"
tree-sitter-containerfile = "0.9.2"
tree-sitter-commonlisp = "0.4.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart-orchard = "0.7.0"
tree-sitter-devicetree = "0.15.0"
tree-sitter-elisp = "1.7.2"
tree-sitter-elixir = "0.3.5"
tree-sitter-elm = "5.9.4"
tree-sitter-erlang = "0.20.0"
tree-sitter-fish = "3.6.0"
tree-sitter-fortran = { version = "0.6.0", optional = true }
tree-sitter-fsharp = { version = "0.3.12", optional = true }
tree-sitter-gleam = "1.0.0"
tree-sitter-go = "0.25.0"
tree-sitter-haskell = { version = "0.24.1", optional = true }
tree-sitter-hcl = "1.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-java-orchard = "0.5.22"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-julia = { version = "0.23.1", optional = true }
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1.1"
tree-sitter-newick = "1.1.0"
tree-sitter-nix = "0.3.0"
tree-sitter-objc = "3.0.2"
tree-sitter-ocaml = { version = "0.26.0", optional = true }
tree-sitter-pascal = "0.10.2"
tree-sitter-php = "0.24.2"
tree-sitter-proto = "0.6.0"
tree-sitter-python = "0.25.0"
tree-sitter-qmljs = { version = "0.3.1", optional = true }
tree-sitter-r = "1.3.0"
tree-sitter-racket = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust-orchard = "0.16.10"
tree-sitter-scala = "0.26.2"
tree-sitter-scheme = "0.24.7"
tree-sitter-sequel = "0.3.11"
tree-sitter-sfapex = { version = "3.0.1", optional = true }
tree-sitter-solidity = "1.2.13"
tree-sitter-swift = "0.7.3"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-verilog = { version = "1.0.3", optional = true }
tree-sitter-vhdl = { version = "1.4.0", optional = true }
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"
ts-parser-perl = "2.0.0"

[build-dependencies]
cc = "1.2"
rayon = "1.12.0"
toml = "1.1"

[features]
all-languages = ["lang-fortran", "lang-fsharp", "lang-verilog", "lang-ocaml", "lang-julia", "lang-haskell", "lang-vhdl", "lang-apex", "lang-qml"]
lang-fortran = ["dep:tree-sitter-fortran"]
lang-fsharp = ["dep:tree-sitter-fsharp"]
lang-verilog = ["dep:tree-sitter-verilog"]
lang-ocaml = ["dep:tree-sitter-ocaml"]
lang-julia = ["dep:tree-sitter-julia"]
lang-haskell = ["dep:tree-sitter-haskell"]
lang-vhdl = ["dep:tree-sitter-vhdl"]
lang-apex = ["dep:tree-sitter-sfapex"]
lang-qml = ["dep:tree-sitter-qmljs"]
# Test helpers for crates that test against the engine and the plugin
# pipeline.
test-support = []

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
