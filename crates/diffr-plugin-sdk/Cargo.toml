[package]
name = "diffr-plugin-sdk"
description = "The diffr plugin contract in Rust: one trait for native and WASM plugins."
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
serde = "1.0"

# The guest bindings exist only in a component.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The newest wit-bindgen whose rust-version (1.85) matches diffr's.
wit-bindgen = "0.60.0"
# The resource's `new` deserializes the options string.
serde_json = "1.0"
