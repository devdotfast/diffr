[package]
name = "diffr-web"
description = "diffr for the browser: the engine and the bundled plugins behind a wasm-bindgen API."
repository = "https://github.com/devdotfast/diffr"
license = "MIT"
version = "0.1.9"
edition = "2021"
rust-version = "1.99.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
diffr-core = { path = "../diffr-core", version = "0.1.9" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.129"
console_error_panic_hook = "0.1.7"

[features]
all-languages = ["diffr-core/all-languages"]
