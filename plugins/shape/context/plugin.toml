name = "context"
title = "Context"
description = "Keep changes, nearby lines and enclosing headers visible; fold every remaining interval once, with collapsed syntax folds inside."

[enabled]
title = "Collapse unchanged lines"
description = "Show one fold per hidden interval. Expanding it reveals the original syntax folds."

[options.lines]
type = "integer"
minimum = 0
maximum = 4294967295
title = "Context lines"
description = "Unchanged lines kept visible on either side of a change. `-U` overrides it for one run."
default = 3

# The fold queries for each language, as files in this folder.
[queries]
rust = "queries/rust.scm"
python = "queries/python.scm"
go = "queries/go.scm"
javascript = "queries/javascript.scm"
javascriptjsx = "queries/javascript.scm"
typescript = "queries/javascript.scm"
typescripttsx = "queries/javascript.scm"
