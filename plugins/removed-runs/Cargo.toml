[package]
name = "diffr-plugin-removed-runs"
description = "The removed-runs plugin: collapse the middle of long removed stretches."
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
links = "diffr-plugin-removed-runs"
publish = false

[dependencies]
diffr-plugin-sdk = { path = "../../crates/diffr-plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }

[package.metadata.diffr]
native = true
