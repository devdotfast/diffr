[package]
name = "diffr-grammars"
description = "Tree-sitter grammars for diffr, with their largest parse tables stored compressed."
repository = "https://github.com/devdotfast/diffr"
homepage = "https://github.com/devdotfast/diffr"
license = "MIT"
version = "0.1.10"
authors = ["dev.fast"]
edition = "2021"
rust-version = "1.99.0"

include = [
        "/build.rs",
        "/src/",
]

[dependencies]
tree-sitter-language = "0.1.7"
# The grammars' C code calls ZSTD_decompress.
zstd-sys = { version = "2.1.0", default-features = false }

[build-dependencies]
cc = "1.2.48"
object = { version = "0.40", default-features = false, features = ["read_core", "coff", "elf", "macho", "std"] }
rayon = "1.7.0"
serde_json = "1.0"
tree-sitter = "0.26.10"
tree-sitter-c = "0.24"
zstd = { version = "0.13.3", default-features = false }

