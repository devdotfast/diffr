[languages.rust]
folds = '''
([
  (block "{" @fold.open "}" @fold.close)
  (field_declaration_list "{" @fold.open "}" @fold.close)
  (declaration_list "{" @fold.open "}" @fold.close)
  (match_block "{" @fold.open "}" @fold.close)
] @fold
  (#set! tag "body"))
([
  (array_expression "[" @fold.open "]" @fold.close)
  (field_initializer_list "{" @fold.open "}" @fold.close)
] @fold
  (#set! tag "collection"))
((use_declaration) @fold
  (#set! tag "import"))
([
  (line_comment)
  (block_comment)
] @fold
  (#set! tag "comment"))
([
  (string_literal)
  (raw_string_literal)
] @fold
  (#set! tag "string"))
((function_item attributes: (attributes (attribute_item) @_attribute) body: (block "{" @fold.open "}" @fold.close) @fold)
  (#match? @_attribute "test")
  (#set! tag "test"))
'''

[languages.python]
folds = '''
([
  (function_definition ":" @fold.open body: (block) @fold)
  (class_definition ":" @fold.open body: (block) @fold)
  (if_statement ":" @fold.open consequence: (block) @fold)
  (elif_clause ":" @fold.open consequence: (block) @fold)
  (else_clause ":" @fold.open body: (block) @fold)
  (for_statement ":" @fold.open body: (block) @fold)
  (while_statement ":" @fold.open body: (block) @fold)
  (with_statement ":" @fold.open body: (block) @fold)
  (try_statement ":" @fold.open body: (block) @fold)
  (except_clause ":" @fold.open (block) @fold)
  (finally_clause ":" @fold.open (block) @fold)
  (match_statement ":" @fold.open body: (block) @fold)
  (case_clause ":" @fold.open consequence: (block) @fold)
]
  (#set! tag "body"))
([
  (list "[" @fold.open "]" @fold.close)
  (dictionary "{" @fold.open "}" @fold.close)
  (set "{" @fold.open "}" @fold.close)
  (tuple "(" @fold.open ")" @fold.close)
] @fold
  (#set! tag "collection"))
((tuple) @fold (#not-match? @fold "^\\(") (#set! tag "collection"))
([
  (import_statement)
  (import_from_statement)
] @fold
  (#set! tag "import"))
((comment) @fold
  (#set! tag "comment"))
((string) @fold
  (#set! tag "string"))
(function_definition name: (identifier) @_name ":" @fold.open body: (block) @fold
  (#match? @_name "^test_") (#set! tag "test"))
'''

[languages.go]
folds = '''
([
  (block "{" @fold.open "}" @fold.close)
  (field_declaration_list "{" @fold.open "}" @fold.close)
] @fold
  (#set! tag "body"))
((literal_value "{" @fold.open "}" @fold.close) @fold
  (#set! tag "collection"))
((import_declaration) @fold
  (#set! tag "import"))
((comment) @fold
  (#set! tag "comment"))
([
  (raw_string_literal)
  (interpreted_string_literal)
] @fold
  (#set! tag "string"))
(function_declaration name: (identifier) @_name body: (block "{" @fold.open "}" @fold.close) @fold
  (#match? @_name "^Test") (#set! tag "test"))
'''

