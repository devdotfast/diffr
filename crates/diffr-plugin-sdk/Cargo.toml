[package]
name = "diffr-plugin-sdk"
description = "The diffr plugin contract in Rust: one trait for native and WASM plugins."
version = "0.1.1"
edition = "2021"
rust-version = "1.99.0"
license = "MIT"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
serde = "1.0"
# Generates the contract's records from `wit/plugin.wit`, for every target:
# the records are plain Rust, and only the export glue is wasm-specific.
wit-bindgen = "0.62.0"
