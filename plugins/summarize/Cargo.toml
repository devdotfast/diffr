[package]
name = "diffr-plugin-summarize"
description = "The summarize plugin: pseudocode summaries for large new function bodies."
version = "0.1.1"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
links = "diffr-plugin-summarize"

[dependencies]
diffr-plugin-sdk = { path = "../../crates/diffr-plugin-sdk", version = "0.1.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasi = "=0.14.2"

[package.metadata.diffr]
native = false
