[package]
name = "diffr-plugin-hide-files"
description = "The hide-files plugin: hide whole files by their tags or status."
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
links = "diffr-plugin-hide-files"
publish = false

[dependencies]
diffr-plugin-sdk = { path = "../../crates/diffr-plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }

[package.metadata.diffr]
native = true
