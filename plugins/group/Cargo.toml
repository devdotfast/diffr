[package]
name = "diffr-plugin-group"
description = "The group plugin: wrap runs of collapsed regions in one fold."
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
links = "diffr-plugin-group"
publish = false

[dependencies]
diffr-plugin-sdk = { path = "../../crates/diffr-plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }

[package.metadata.diffr]
native = true
