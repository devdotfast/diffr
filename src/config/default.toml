# Bundled defaults. The user config keeps only what differs from these.
version = 1

[plugins]
order = [
    "bundled.context",
    "bundled.hide-files",
    "bundled.deleted-bodies",
    "bundled.summarize",
    "bundled.test-bodies",
    "bundled.removed-runs",
    "bundled.group",
]

[plugins.bundled.context]
enabled = true
lines = 3

[plugins.bundled.deleted-bodies]
enabled = true
min_lines = 12

[plugins.bundled.group]
enabled = true

[plugins.bundled.hide-files]
enabled = true
tags = [
    "generated",
    "vendored",
    "test",
]
deleted = true

[plugins.bundled.removed-runs]
enabled = true
min_lines = 5

[plugins.bundled.summarize]
enabled = false
provider = "gemini"
min_lines = 20
tests = true
test_min_lines = 20
request_timeout_ms = 60000
max_concurrency = 16
retries = 3

[plugins.bundled.test-bodies]
enabled = true
min_lines = 3

[theme]
name = "default-dark"

[diff]
byte_limit = 1000000
graph_limit = 3000000
parse_error_limit = 0
