[package]
name = "diffr-plugin-deleted-bodies"
description = "The deleted-bodies plugin: collapse deleted function bodies."
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
links = "diffr-plugin-deleted-bodies"
publish = false

[dependencies]
diffr-plugin-sdk = { path = "../../crates/diffr-plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }

[package.metadata.diffr]
native = true
