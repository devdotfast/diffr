[package]
name = "diffr-cli"
description = "Structural diffs with a streaming API and interactive terminal frontend."
repository = "https://github.com/devdotfast/diffr"
homepage = "https://github.com/devdotfast/diffr"
license = "MIT"
version = "0.1.9"
authors = ["dev.fast"]
keywords = ["diff", "syntax"]
categories = ["development-tools", "command-line-utilities", "parser-implementations"]
edition = "2021"
# Goal: support at least 12 months of Rust versions, and be
# conservative about upgrades to help packagers.
#
# https://releases.rs/ is a useful website to see when different Rust
# versions were released.
#
# The client-side WASM build needs 1.89 or later: earlier releases pass
# structs to C code (tree-sitter) with a non-standard ABI on
# wasm32-unknown-unknown.
rust-version = "1.99.0"

include = [
        "/build.rs",
        "/src/",
        "/wit/",
        "/LICENSE",
        "/README.md",
]

[dependencies]
typed-arena = "2.0.2"
log = "0.4.34"

glob = "0.3.4"
strum = { version = "0.28", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
encoding_rs = "0.8.42"

toml = { version = "1.1", default-features = false, features = ["display", "parse", "serde", "std"] }
toml_edit = "0.25.15"
# The structural diff engine and the diff session: configuration, plugins,
# tags and one file's record.
diffr-core = { path = "crates/diffr-core", version = "0.1.9" }
# The plugin contract, which WASM component plugins are called through.
diffr-plugin-sdk = { path = "crates/diffr-plugin-sdk", version = "0.1.1" }
# Git, the WASM component runtime, threads and the terminal.
git2 = { version = "0.21", default-features = false }
clap = { version = "4.6.7", features = ["cargo", "derive", "env", "wrap_help", "string"] }
libc = "0.2.189"
pretty_env_logger = "0.5.0"
rayon = "1.12.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync"] }
tree_magic_mini = "3.2.2"
terminal_size = "0.4.4"
dirs = "7"
# WASM component plugins.
wasmtime = { version = "49.0.1", default-features = false, features = ["runtime", "cranelift", "component-model", "cache", "parallel-compilation", "std", "anyhow"] }
wasmtime-wasi = { version = "49.0.1", default-features = false, features = ["p2"] }
# The byte buffer a guest's output stream is handed, wasmtime-wasi's own.
bytes = "1.12"
wasmtime-wasi-http = { version = "49.0.1", default-features = false, features = ["p2", "default-send-request"] }

[target.'cfg(not(any(windows, target_os = "illumos", target_os = "freebsd")))'.dependencies]
tikv-jemallocator = "0.7"

[dev-dependencies]
diffr-core = { path = "crates/diffr-core", version = "0.1.9", features = ["test-support"] }
# The summarizer's own selection, which its component tests check against.
diffr-plugin-summarize = { path = "plugins/summarize", version = "0.1.1" }
assert_cmd = "2.2.2"
predicates = "3.1.4"

pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[build-dependencies]
version_check = "0.9.5"

[workspace]
members = [
    "xtask",
	"crates/diffr-core",
	"crates/diffr-web",
	"crates/diffr-plugin-sdk",
	"plugins/context",
	"plugins/deleted-bodies",
	"plugins/group",
	"plugins/hide-files",
	"plugins/removed-runs",
	"plugins/summarize",
	"plugins/test-bodies",
	"examples/plugins/fixtures",
]
default-members = [
	".",
	"crates/diffr-core",
	"crates/diffr-plugin-sdk",
	"plugins/context",
	"plugins/deleted-bodies",
	"plugins/group",
	"plugins/hide-files",
	"plugins/removed-runs",
	"plugins/summarize",
	"plugins/test-bodies",
	"examples/plugins/fixtures",
]

[workspace.metadata.diffr]
wasm-test-exclude = []

[profile.release]
lto = "thin"

# Reading git repositories, running component plugins and the stream; the
# diff session itself is diffr-core's.
[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "diffr"
path = "src/main.rs"

[package.metadata.binstall]
# Tags have no "v" prefix; binaries sit at the archive root.
pkg-url = "{ repo }/releases/download/{ version }/diffr-{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.deb]
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
	"$auto",
	[ "diffr.1", "usr/share/man/man1/", "644" ],
	[ "CHANGELOG.md", "usr/share/doc/difftastic/", "644" ],
]

# The component tests build every plugin for wasm32-wasip2, so they run only
# where that target is installed: `cargo test --features wasm-plugin-tests`,
# and the Linux job in CI.
[[test]]
name = "wasm"
required-features = ["wasm-plugin-tests"]

[features]
all-languages = ["lang-fortran", "lang-fsharp", "lang-verilog", "lang-ocaml", "lang-julia", "lang-haskell", "lang-vhdl", "lang-apex", "lang-qml"]
lang-fortran = ["diffr-core/lang-fortran"]
lang-fsharp = ["diffr-core/lang-fsharp"]
lang-verilog = ["diffr-core/lang-verilog"]
lang-ocaml = ["diffr-core/lang-ocaml"]
lang-julia = ["diffr-core/lang-julia"]
lang-haskell = ["diffr-core/lang-haskell"]
lang-vhdl = ["diffr-core/lang-vhdl"]
lang-apex = ["diffr-core/lang-apex"]
lang-qml = ["diffr-core/lang-qml"]
wasm-plugin-tests = []
